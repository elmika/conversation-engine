# CI: lint + tests for backend and frontend on every push.
# Checks after install run even if an earlier one fails, so every failure shows at once.
# Runs Python/Node directly on the runner (no Docker), with versions pinned to match
# Dockerfile (python:3.11-slim) and frontend/Dockerfile (node:22). No secrets needed:
# backend tests use in-memory SQLite and a fake LLM (tests/conftest.py).

name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Same install as the Dockerfile's builder stage (keep the ruff pin in sync with it).
      - name: Install dependencies
        id: install
        run: |
          pip install -r requirements.txt pytest pytest-asyncio ruff==0.17.3
          pip install -e . --no-deps

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check .

      # Includes tests/test_architecture.py (the `make check-layers` layer rules).
      - name: Pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest

  frontend:
    name: Frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in frontend/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
