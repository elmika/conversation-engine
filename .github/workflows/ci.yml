# CI: lint + tests for backend and frontend on every push.
# Checks after install run even if an earlier one fails, so every failure shows at once.
# Runs Python/Node directly on the runner (no Docker), with versions pinned to match
# Dockerfile (python:3.11-slim, uv) and frontend/Dockerfile (node:22). No secrets needed:
# backend tests use in-memory SQLite and a fake LLM (tests/conftest.py).
# Actions are pinned to full commit SHAs (tag in the trailing comment): a tag can be moved,
# a SHA can't. To upgrade one, look up the new tag's commit and update both.

name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep the uv version in sync with the Dockerfile.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.11"
          enable-cache: true

      # Same install as the Dockerfile's builder stage: exact versions from uv.lock, and
      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        id: install
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync ruff format --check .

      # Includes tests/test_architecture.py (the `make check-layers` layer rules).
      - name: Pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync python -m pytest

  frontend:
    name: Frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from "packageManager" in frontend/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
