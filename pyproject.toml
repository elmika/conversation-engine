[project]
name = "conversation-engine"
version = "0.1.0"
description = "Production-ready conversation engine with dynamic prompts, streaming, and quality controls"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "anthropic>=0.72",
    "sqlalchemy>=2.0",
    "httpx>=0.28.0",
]

# Exact versions of everything (dev group included) are locked in uv.lock: change dependencies
# with `uv add` / `uv remove`, or edit here and run `uv lock`. CI fails if uv.lock is out of date.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff==0.17.3",
]

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["UP045"]  # Optional[X] kept for Python 3.9 compatibility
[tool.ruff.lint.per-file-ignores]
"app/api/routes.py" = ["B008"]
