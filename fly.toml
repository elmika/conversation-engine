# fly.toml app configuration file generated for learning-platform on 2026-09-15T19:30:10+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'learning-platform'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'
  target = 'prod'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[mounts]]
  source = 'skillforge_data'
  destination = '/app/data'

[env]
  # Fly machines support only one mounted volume; sections live as a
  # subdirectory inside the same /app/data volume instead of a second mount.
  SECTIONS_DIR = '/app/data/sections'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
