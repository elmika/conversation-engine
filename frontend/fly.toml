# fly.toml app configuration file generated for skillforge-web on 2026-09-15T19:35:14+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'skillforge-web'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'
  target = 'runner'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
